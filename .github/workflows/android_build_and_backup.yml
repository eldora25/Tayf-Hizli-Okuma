name: Tayf Hızlı Okuma Android Derleme ve Yedekleme Otomasyonu

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-backup:
    runs-on: ubuntu-latest

    steps:
      # 1. Depodaki kodları tam geçmişle iş akışına çek
      - name: Kaynak Kodları Çek (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Kaynak dosyalarını izole build numaralı klasöre yedekle
      - name: Kaynak Kodları İzole Klasörde Yedekle
        run: |
          BUILD_NO="${{ github.run_number }}"
          BACKUP_DIR="backups/build-$BUILD_NO"
          
          mkdir -p "$BACKUP_DIR"
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml "$BACKUP_DIR/"; fi
          if [ -d "lib" ]; then cp -r lib/ "$BACKUP_DIR/"; fi

      # 3. Yedek klasörünü bağımsız bir artifact olarak paketle
      - name: Kaynak Kod Yedeklerini Bağımsız Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: tayf-kaynak-kod-yedek-build-${{ github.run_number }}
          path: backups/build-${{ github.run_number }}/

      # 4. Çakışma önleyici pull --rebase kullanarak yedekleri güvenle depoya push et
      - name: Yedekleri Depoya Commit Et ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if ! git diff-index --quiet HEAD; then
            git commit -m "Sistem İzole Yedeklemesi: Build #${{ github.run_number }}"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

      # 5. Java Ortamını Kur
      - name: Java JDK Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 6. Flutter Ortamını Kur
      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 7. Eksik Android Klasörünü ve Proje Şablonunu Oluştur
      - name: Eksik Android Proje Dosyalarını Oluştur
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.tayf.hizliokuma .
          fi

      # 8. Sürüm Yerleştirmesi
      - name: Build Numarasını Kod Yapısına Yaz
        run: |
          BUILD_NO="${{ github.run_number }}"
          sed -i "s/BUILD_NUMBER_PLACEHOLDER/$BUILD_NO/g" lib/home_screen.dart || true
          sed -i "s/BUILD_NUMBER_PLACEHOLDER/$BUILD_NO/g" lib/reader_screen.dart || true

      # 9. Bağımlılıkları Çek (Bu işlem file_picker dahil paketleri önbelleğe indirir)
      - name: Flutter Bağımlılıklarını Getir
        run: flutter pub get

      # 10. [HATA ÇÖZÜMÜ]: Paketler İndirildikten Sonra Pub-Cache Üzerinden API 36 Zorlaması
      - name: Android compileSdk Sürümünü 36'ya Yükselt (Pluginler Dahil)
        run: |
          # A) Ana Android projesi için API 36 zorlaması
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/compileSdk(Version)?([[:space:]]*=?[[:space:]]*)(flutter\.compileSdkVersion|[0-9]+)/compileSdk\1\236/g' {} +
          
          # B) İndirilen Eklentiler (file_picker vb.) için Pub-Cache üzerinde API 36 zorlaması
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          PUB_CACHE_DIR="$FLUTTER_DIR/.pub-cache"
          
          # Flutter kurulum dizinindeki pub-cache'i güncelle
          if [ -d "$PUB_CACHE_DIR" ]; then
            find "$PUB_CACHE_DIR" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/compileSdk(Version)?([[:space:]]*=?[[:space:]]*)[0-9]+/compileSdk\1\236/g' {} + || true
          fi
          
          # Ortam değişkeni (kullanıcı) dizinindeki pub-cache'i güncelle
          if [ -d "$HOME/.pub-cache" ]; then
            find "$HOME/.pub-cache" -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/compileSdk(Version)?([[:space:]]*=?[[:space:]]*)[0-9]+/compileSdk\1\236/g' {} + || true
          fi

      # 11. Android Debug APK Derle
      - name: Android Debug APK Derle
        run: flutter build apk --debug

      # 12. APK Dosyasını Dinamik Yeniden İsimlendir
      - name: APK Dosyasını Dinamik Yeniden İsimlendir
        run: |
          BUILD_NO="${{ github.run_number }}"
          ORIGINAL_APK="build/app/outputs/flutter-apk/app-debug.apk"
          NEW_APK="build/app/outputs/flutter-apk/tayf-hizli-okuma-$BUILD_NO-debug.apk"
          if [ -f "$ORIGINAL_APK" ]; then
            mv "$ORIGINAL_APK" "$NEW_APK"
          else
            echo "APK bulunamadı, derleme başarısız."
            exit 1
          fi

      # 13. APK Çıktısını Yayınla (Upload Artifact)
      - name: APK Çıktısını Yayınla (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tayf-hizli-okuma-${{ github.run_number }}-debug-apk
          path: build/app/outputs/flutter-apk/tayf-hizli-okuma-${{ github.run_number }}-debug.apk
