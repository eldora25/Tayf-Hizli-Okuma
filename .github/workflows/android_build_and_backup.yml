name: Tayf Hızlı Okuma Android Derleme ve Yedekleme Otomasyonu

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-backup:
    runs-on: ubuntu-latest

    steps:
      # 1. Depodaki kodları tam geçmişle iş akışına çek
      - name: Kaynak Kodları Çek (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Kaynak dosyalarını izole build numaralı klasöre yedekle
      - name: Kaynak Kodları İzole Klasörde Yedekle
        run: |
          BUILD_NO="${{ github.run_number }}"
          BACKUP_DIR="backups/build-$BUILD_NO"
          
          mkdir -p "$BACKUP_DIR"
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml "$BACKUP_DIR/"; fi
          if [ -d "lib" ]; then cp -r lib/ "$BACKUP_DIR/"; fi

      # 3. Yedek klasörünü bağımsız bir artifact olarak paketle
      - name: Kaynak Kod Yedeklerini Bağımsız Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: tayf-kaynak-kod-yedek-build-${{ github.run_number }}
          path: backups/build-${{ github.run_number }}/

      # 4. Çakışma önleyici pull --rebase kullanarak yedekleri güvenle depoya push et
      - name: Yedekleri Depoya Commit Et ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if ! git diff-index --quiet HEAD; then
            git commit -m "Sistem İzole Yedeklemesi: Build #${{ github.run_number }}"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

      # 5. Java Ortamını Kur
      - name: Java JDK Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 6. Flutter Ortamını Kur
      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 7. Eksik Android Klasörünü ve Proje Şablonunu Oluştur
      - name: Eksik Android Proje Dosyalarını Oluştur
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.tayf.hizliokuma .
          fi

      # 8. [HATA ÇÖZÜMÜ]: Tüm Eklentiler (Plugin) ve App İçin API 36 Zorlaması
      - name: Android compileSdk Sürümünü 36'ya Yükselt
        run: |
          # Dinamik arama ile hem Groovy (.gradle) hem de Kotlin DSL (.kts) dosyalarını bul ve API'yi 36 yap
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/flutter.compileSdkVersion/36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdkVersion 33/compileSdkVersion 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk = 33/compileSdk = 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk = 34/compileSdk = 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk 33/compileSdk 36/g' {} +
          find android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk 34/compileSdk 36/g' {} +
          
          # Groovy sistemi (.gradle) için alt projelere (plugins) API 36 zorlaması
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle
            
            subprojects {
                afterEvaluate { project ->
                    if (project.hasProperty('android')) {
                        project.android {
                            compileSdkVersion 36
                        }
                    }
                }
            }
          EOF
          fi
          
          # Kotlin DSL sistemi (.kts) için alt projelere (plugins) API 36 zorlaması
          if [ -f "android/build.gradle.kts" ]; then
            cat << 'EOF' >> android/build.gradle.kts
            
            subprojects {
                afterEvaluate {
                    val androidExtension = extensions.findByName("android")
                    if (androidExtension != null) {
                        try {
                            val method = androidExtension.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType)
                            method.invoke(androidExtension, 36)
                        } catch (e: Exception) { }
                    }
                }
            }
          EOF
          fi

      # 9. Sürüm Yerleştirmesi
      - name: Build Numarasını Kod Yapısına Yaz
        run: |
          BUILD_NO="${{ github.run_number }}"
          sed -i "s/BUILD_NUMBER_PLACEHOLDER/$BUILD_NO/g" lib/home_screen.dart || true
          sed -i "s/BUILD_NUMBER_PLACEHOLDER/$BUILD_NO/g" lib/reader_screen.dart || true

      # 10. Bağımlılıkları Çek
      - name: Flutter Bağımlılıklarını Getir
        run: flutter pub get

      # 11. Android Debug APK Derle
      - name: Android Debug APK Derle
        run: flutter build apk --debug

      # 12. APK Dosyasını Dinamik Yeniden İsimlendir
      - name: APK Dosyasını Dinamik Yeniden İsimlendir
        run: |
          BUILD_NO="${{ github.run_number }}"
          ORIGINAL_APK="build/app/outputs/flutter-apk/app-debug.apk"
          NEW_APK="build/app/outputs/flutter-apk/tayf-hizli-okuma-$BUILD_NO-debug.apk"
          if [ -f "$ORIGINAL_APK" ]; then
            mv "$ORIGINAL_APK" "$NEW_APK"
          else
            echo "APK bulunamadı, derleme başarısız."
            exit 1
          fi

      # 13. APK Çıktısını Yayınla (Upload Artifact)
      - name: APK Çıktısını Yayınla (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tayf-hizli-okuma-${{ github.run_number }}-debug-apk
          path: build/app/outputs/flutter-apk/tayf-hizli-okuma-${{ github.run_number }}-debug.apk
