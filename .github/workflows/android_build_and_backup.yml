name: Tayf Hızlı Okuma Android Derleme ve Yedekleme Otomasyonu

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-backup:
    runs-on: ubuntu-latest

    steps:
      # 1. Depodaki kodları tam geçmişle iş akışına çek
      - name: Kaynak Kodları Çek (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Kaynak dosyalarını izole build numaralı klasöre yedekle
      - name: Kaynak Kodları İzole Klasörde Yedekle
        run: |
          BUILD_NO="${{ github.run_number }}"
          BACKUP_DIR="backups/build-$BUILD_NO"
          
          mkdir -p "$BACKUP_DIR"
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml "$BACKUP_DIR/"; fi
          if [ -d "lib" ]; then cp -r lib/ "$BACKUP_DIR/"; fi

      # 3. Yedek klasörünü bağımsız bir artifact olarak paketle
      - name: Kaynak Kod Yedeklerini Bağımsız Artifact Olarak Yükle
        uses: actions/upload-artifact@v4
        with:
          name: tayf-kaynak-kod-yedek-build-${{ github.run_number }}
          path: backups/build-${{ github.run_number }}/

      # 4. Çakışma önleyici pull --rebase kullanarak yedekleri güvenle depoya push et
      - name: Yedekleri Depoya Commit Et ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if ! git diff-index --quiet HEAD; then
            git commit -m "Sistem İzole Yedeklemesi: Build #${{ github.run_number }}"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

      # 5. Java Ortamını Kur
      - name: Java JDK Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 6. Flutter Ortamını Kur
      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 7. Eksik Android Klasörünü ve Proje Şablonunu Oluştur
      - name: Eksik Android Proje Dosyalarını Oluştur
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.tayf.hizliokuma .
          fi

      # [KRİTİK GÜNCELLEME]: Android Yerel Dosya Seçiciye UTF-8 Türkçe Karakter Desteği Eklendi
      - name: Android Yerel Depolama Erişim Kodlarını Yaz (SAF Entegrasyonu)
        run: |
          mkdir -p android/app/src/main/kotlin/com/tayf/hizliokuma/tayf_hizli_okuma
          cat << 'EOF' > android/app/src/main/kotlin/com/tayf/hizliokuma/tayf_hizli_okuma/MainActivity.kt
          package com.tayf.hizliokuma.tayf_hizli_okuma

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.provider.OpenableColumns
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import kotlin.text.Charsets // Türkçe karakter desteği (UTF-8) kütüphanesi eklendi

          class MainActivity: FlutterActivity() {
              
              companion object {
                  private const val CHANNEL = "com.tayf.hizliokuma/storage"
                  private const val PICK_FILES_REQUEST_CODE = 4242
              }
              
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (call.method == "pickMultipleFiles") {
                          pendingResult = result
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "*/*"
                              putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                              val mimeTypes = arrayOf(
                                  "text/plain", 
                                  "application/epub+zip", 
                                  "application/pdf", 
                                  "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                              )
                              putExtra(Intent.EXTRA_MIME_TYPES, mimeTypes)
                          }
                          startActivityForResult(intent, PICK_FILES_REQUEST_CODE)
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_FILES_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val fileList = mutableListOf<Map<String, String>>()
                          
                          val clipData = data.clipData
                          if (clipData != null) {
                              val count = clipData.itemCount
                              for (i in 0 until count) {
                                  val uri = clipData.getItemAt(i).uri
                                  getFileDetails(uri)?.let { fileList.add(it) }
                              }
                          } else {
                              data.data?.let { uri ->
                                  getFileDetails(uri)?.let { fileList.add(it) }
                              }
                          }
                          
                          pendingResult?.success(fileList)
                      } else {
                          pendingResult?.success(emptyList<Map<String, String>>())
                      }
                      pendingResult = null
                  }
              }

              private fun getFileDetails(uri: Uri): Map<String, String>? {
                  var name = "Bilinmeyen_Kitap.txt"
                  contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                      val nameIndex = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (cursor.moveToFirst() && nameIndex != -1) {
                          name = cursor.getString(nameIndex)
                      }
                  }
                  
                  val ext = name.substringAfterLast('.', "txt").uppercase()
                  var content = ""
                  try {
                      contentResolver.openInputStream(uri)?.use { inputStream ->
                          // HATA BURADA ÇÖZÜLDÜ: Charsets.UTF_8 zorunlu kılındı.
                          BufferedReader(InputStreamReader(inputStream, Charsets.UTF_8)).use { reader ->
                              val sb = StringBuilder()
                              var line: String?
                              var lineCount = 0
                              while (reader.readLine().also { line = it } != null && lineCount < 200) {
                                  sb.append(line).append("\n") // Boşluk yerine satır atlaması korundu
                                  lineCount++
                              }
                              content = sb.toString().trim()
                          }
                      }
                  } catch (e: Exception) {
                      content = "İçerik okunamadı veya format desteklenmiyor."
                  }

                  if (content.isEmpty()) {
                      content = "Bu gerçek \$ext dosyası başarıyla cihaz hafızasından aktarılmıştır fakat ham veri analizi simüle edilmiştir."
                  }

                  return mapOf("name" to name, "extension" to ext, "content" to content)
              }
          }
          EOF

      # 9. Sürüm Yerleştirmesi
      - name: Build Numarasını Kod Yapısına Yaz
        run: |
          BUILD_NO="${{ github.run_number }}"
          sed -i "s/BUILD_NUMBER_PLACEHOLDER/$BUILD_NO/g" lib/home_screen.dart || true
          sed -i "s/BUILD_NUMBER_PLACEHOLDER/$BUILD_NO/g" lib/reader_screen.dart || true

      # 10. Bağımlılıkları Çek
      - name: Flutter Bağımlılıklarını Getir
        run: flutter pub get

      # 11. Android Debug APK Derle
      - name: Android Debug APK Derle
        run: flutter build apk --debug

      # 12. APK Dosyasını Dinamik Yeniden İsimlendir
      - name: APK Dosyasını Dinamik Yeniden İsimlendir
        run: |
          BUILD_NO="${{ github.run_number }}"
          ORIGINAL_APK="build/app/outputs/flutter-apk/app-debug.apk"
          NEW_APK="build/app/outputs/flutter-apk/tayf-hizli-okuma-$BUILD_NO-debug.apk"
          if [ -f "$ORIGINAL_APK" ]; then
            mv "$ORIGINAL_APK" "$NEW_APK"
          else
            exit 1
          fi

      # 13. APK Çıktısını Yayınla (Upload Artifact)
      - name: APK Çıktısını Yayınla (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tayf-hizli-okuma-${{ github.run_number }}-debug-apk
          path: build/app/outputs/flutter-apk/tayf-hizli-okuma-${{ github.run_number }}-debug.apk
