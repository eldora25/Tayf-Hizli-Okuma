name: Tayf Hızlı Okuma Android Derleme ve Yedekleme Otomasyonu

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-backup:
    runs-on: ubuntu-latest

    steps:
      # 1. Depodaki kodları tam geçmişle iş akışına çek
      - name: Kaynak Kodları Çek (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Kaynak dosyalarını yedekleme klasörüne kopyala ve dinamik isimlendir
      - name: Kaynak Kodları Yedekle ve İsimlendir
        run: |
          BUILD_NO="${{ github.run_number }}"
          COMMIT_NO="${{ github.run_id }}"
          BACKUP_DIR="backups"
          
          mkdir -p $BACKUP_DIR
          
          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml "$BACKUP_DIR/pubspec.yaml.$BUILD_NO-$COMMIT_NO"
          fi
          
          if [ -d "lib" ]; then
            find lib -type f -not -path "*/$BACKUP_DIR/*" | while read -r file; do
              filename=$(basename -- "$file")
              extension="${filename##*.}"
              filename_no_ext="${filename%.*}"
              
              cp "$file" "$BACKUP_DIR/$filename_no_ext.$extension.$BUILD_NO-$COMMIT_NO"
            done
          fi

      # 3. Çakışma önleyici pull --rebase kullanarak yedekleri güvenle depoya push et
      - name: Yedekleri Depoya Commit Et ve Güvenle Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Sistem Yedeklemesi: Build #${{ github.run_number }} | Commit: ${{ github.run_id }}"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          else
            echo "Değişiklik yok, push atlandı."
          fi

      # 4. Java Ortamını Kur
      - name: Java JDK Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 5. Flutter Ortamını Kur
      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 6. Eksik Android Klasörünü ve build.gradle Dosyalarını Otomatik Üret
      - name: Eksik Android Proje Dosyalarını Oluştur
        run: |
          if [ ! -d "android" ]; then
            echo "Android klasörü eksik! Otomatik oluşturuluyor..."
            flutter create --platforms=android .
          else
            echo "Android klasörü mevcut."
          fi

      # [YENİ ADIM] 7. Uygulama koduna dinamik olarak derleme numarasını enjekte et
      - name: Build Numarasını Kod Yapısına Yaz
        run: |
          BUILD_NO="${{ github.run_number }}"
          sed -i "s/BUILD_NUMBER_PLACEHOLDER/$BUILD_NO/g" lib/home_screen.dart || true
          sed -i "s/BUILD_NUMBER_PLACEHOLDER/$BUILD_NO/g" lib/reader_screen.dart || true

      # 8. Bağımlılıkları Çek
      - name: Flutter Bağımlılıklarını Getir
        run: flutter pub get

      # 9. Android Debug APK'sını Derle
      - name: Android Debug APK Derle
        run: flutter build apk --debug

      # 10. APK Dosyasını Dinamik Olarak Yeniden İsimlendir
      - name: APK Dosyasını Dinamik Yeniden İsimlendir
        run: |
          BUILD_NO="${{ github.run_number }}"
          ORIGINAL_APK="build/app/outputs/flutter-apk/app-debug.apk"
          NEW_APK="build/app/outputs/flutter-apk/tayf-hizli-okuma-$BUILD_NO-debug.apk"
          
          if [ -f "$ORIGINAL_APK" ]; then
            mv "$ORIGINAL_APK" "$NEW_APK"
            echo "APK başarıyla yeniden isimlendirildi: $NEW_APK"
          else
            echo "HATA: Derlenen APK dosyası bulunamadı!"
            exit 1
          fi

      # 11. Dinamik İsimlendirilen APK'yı İndirilebilir Çıktı Olarak Yükle
      - name: APK Çıktısını Yayınla (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tayf-hizli-okuma-${{ github.run_number }}--debug-apk
          path: build/app/outputs/flutter-apk/tayf-hizli-okuma-${{ github.run_number }}-debug.apk
